databases:
  - name: bimfm-portal-db
    plan: basic-256mb
    databaseName: bimfm_portal
    user: bimfm_portal

services:
  - type: web
    name: bimfm-portal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: bimfm-portal-db
          property: connectionString
      - key: BIMFM_ENV
        value: "production"
      - key: BIMFM_LOG_LEVEL
        value: "INFO"
      - key: BIMFM_COOKIE_HTTPS_ONLY
        value: "true"
      - key: BIMFM_SESSION_SECRET
        generateValue: true
      - key: BIMFM_PROJECT_SYNC_TOKEN
        generateValue: true
      - key: BIMFM_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BIMFM_BOOTSTRAP_ADMIN_DISPLAY_NAME
        sync: false
      - key: BIMFM_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
