services:
  - type: web
    name: bimfm-portal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: BIMFM_ENV
        value: "production"
      - key: BIMFM_LOG_LEVEL
        value: "INFO"
      - key: BIMFM_COOKIE_HTTPS_ONLY
        value: "true"
      - key: BIMFM_SESSION_SECRET
        sync: false
