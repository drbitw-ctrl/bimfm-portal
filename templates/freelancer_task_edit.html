{% extends "base.html" %}
{% block title %}Edit Daily Task · {{ app_name }}{% endblock %}
{% block content %}
<div class="toolbar"><div><span class="eyebrow">DAILY TASK</span><h1>Edit Task</h1><p class="muted">{{ task.task_date }}</p></div><a class="button secondary" href="/tasks?month={{ task.task_date.strftime('%Y-%m') }}">{{ t('Back') }}</a></div>
<section class="panel"><form method="post" class="form-grid">
<input type="hidden" name="csrf" value="{{ csrf_token }}">
<div><label>Project Code</label><input name="project_code" value="{{ task.project_code }}" required></div>
<div><label>Project Name</label><input name="project_name" value="{{ task.project_name or '' }}"></div>
<div><label>Discipline</label><input name="discipline" value="{{ task.discipline or '' }}"></div>
<div><label>{{ t('Status') }}</label><select name="task_status"><option {% if task.task_status=='COMPLETED' %}selected{% endif %}>COMPLETED</option><option {% if task.task_status=='IN_PROGRESS' %}selected{% endif %}>IN_PROGRESS</option><option {% if task.task_status=='ON_HOLD' %}selected{% endif %}>ON_HOLD</option></select></div>
<div><label>Completion Percentage</label><input type="number" name="completion_percentage" value="{{ task.completion_percentage }}" min="0" max="100" required></div>
<div><label>Time Spent</label><input type="number" name="hours_spent" value="{{ hours_input(task.minutes_spent) }}" min="0.25" max="24" step="0.25" required></div>
<div class="full-width"><label>Task Description</label><textarea name="task_description" rows="3" required>{{ task.task_description }}</textarea></div>
<div class="full-width"><label>Accomplishment</label><textarea name="accomplishment" rows="3">{{ task.accomplishment or '' }}</textarea></div>
<div class="full-width"><label>{{ t('Notes') }}</label><input name="notes" value="{{ task.notes or '' }}"></div>
<div class="full-width"><button class="primary" {% if month_locked %}disabled{% endif %}>Save Changes</button></div>
</form></section>
{% endblock %}
